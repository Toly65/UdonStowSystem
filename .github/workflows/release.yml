name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  packageName: "com.toly65.udon-stow-system"
  listingRepo: "Toly65/vpm-listing"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version and changelog notes
        run: |
          version=$(jq -r .version package.json)
          echo "version=$version" >> $GITHUB_ENV
          echo "zipFile=${packageName}-${version}.zip" >> $GITHUB_ENV
          # notes = the "## [version]" section of CHANGELOG.md, if there is one
          touch /tmp/notes.md
          [ -f CHANGELOG.md ] && awk -v v="$version" '
            /^## \[/ { if (on) exit; on = index($0, "[" v "]") }
            on' CHANGELOG.md > /tmp/notes.md || true

      - name: Create Zip
        run: zip -r "$zipFile" . -x '*.git*' '.github/*'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # no changelog section -> fall back to GitHub's generated notes
          if [ -s /tmp/notes.md ]; then notes="--notes-file /tmp/notes.md"; else notes="--generate-notes"; fi
          gh release create "$version" "$zipFile" package.json --title "$version" $notes

      - name: Rebuild VPM listing
        env:
          GH_TOKEN: ${{ secrets.LISTING_PAT }}
        run: gh workflow run build-listing.yml --repo "$listingRepo"
